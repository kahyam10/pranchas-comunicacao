<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<title>Pranchas de Comunicação</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="palco" aria-roledescription="carrossel" aria-label="Pranchas de comunicação alternativa">
  <div id="trilho">
    <div class="prancha"><img src="img/p1-prontidao-sintomas.jpg" alt="Prancha 1: Prontidão e Sintomas" draggable="false"></div>
    <div class="prancha"><img src="img/p2-rotina-conforto.jpg" alt="Prancha 2: Rotina e Conforto" draggable="false"></div>
    <div class="prancha"><img src="img/p3-ambiente-social.jpg" alt="Prancha 3: Ambiente e Social" draggable="false"></div>
    <div class="prancha"><img src="img/p4-teclado-letras.jpg" alt="Prancha 4: Teclado e Letras" draggable="false"></div>
  </div>
</main>
<button id="fechar" type="button" aria-label="Fechar o app">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M16 16l4-4-4-4"/><path d="M20 12H10"/></svg>
  <span>Fechar</span>
</button>
<div id="aviso" role="status" hidden></div>
<script src="app.js"></script>
</body>
</html>
